<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>qwertt — Websites people love to use</title>
    <meta name="description" content="Designer & frontend developer from Uzbekistan. Websites and web apps that turn visitors into clients." />
    <meta name="theme-color" content="#111110" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try {
        if (location.pathname === '/' && localStorage.getItem('lang') === 'ru') location.replace('/ru/' + location.search + location.hash)
      } catch (e) {}
      (function () {
        var h = document.documentElement
        var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches
        if (!reduce) {
          h.classList.add('js-motion')
          // safety: never leave content hidden if the app fails to boot
          setTimeout(function () { if (!window.__motionReady) h.classList.remove('js-motion') }, 2500)
        }
        try {
          var home = /^\/(ru\/?)?$/.test(location.pathname)
          if (home && !reduce && !sessionStorage.getItem('introSeen') && !location.hash && !/[?&]nointro/.test(location.search)) {
            h.classList.add('intro-pending')
            setTimeout(function () { h.classList.remove('intro-pending') }, 4000)
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
